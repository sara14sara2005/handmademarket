<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yacine Setifi Artisan</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #f6b26b, #8b5e3c);
}

/* HEADER */
.header{
    text-align:center;
    padding:25px;
    color:white;
    font-size:22px;
    font-weight:bold;
}

/* PROFILE CARD */
.profile{
    max-width:800px;
    margin:20px auto;
    background:white;
    border-radius:16px;
    padding:25px;
    display:flex;
    gap:20px;
    align-items:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* IMAGE */
.profile-img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #c27c59;
    background:#ddd;
}

/* INFO */
.info h2{
    margin:0;
    font-size:22px;
}

.arabic{
    color:#8b5e3c;
    font-size:16px;
}

.desc{
    font-size:14px;
    color:#555;
    margin:8px 0;
}

.badge{
    display:inline-block;
    background:#c27c59;
    color:white;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    margin-top:5px;
}

.contact a{
    display:inline-block;
    margin-top:10px;
    margin-right:10px;
    padding:7px 12px;
    background:#8b5e3c;
    color:white;
    border-radius:6px;
    text-decoration:none;
    font-size:13px;
}

.location{
    font-size:13px;
    margin-top:10px;
    color:#444;
}

.map iframe{
    width:100%;
    height:160px;
    border:none;
    border-radius:12px;
    margin-top:10px;
}

.container{
    max-width:1000px;
    margin:20px auto;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:20px;
    padding:10px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 6px 15px rgba(0,0,0,0.15);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    background:#ddd;
}

.content{
    padding:10px;
    text-align:center;
}

.title{
    font-weight:bold;
    font-size:14px;
}

.price{
    color:#8b5e3c;
    font-weight:bold;
    margin:5px 0;
}

button{
    width:100%;
    padding:7px;
    border:none;
    background:#c27c59;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#a9653f;
}

@media(max-width:800px){

.profile{
    flex-direction:column;
    text-align:center;
}

.container{
    grid-template-columns:repeat(2,1fr);
}

}

</style>
</head>

<body>

<div class="header">
    Artisan Profile
</div>

<div class="profile">

   <img src="images/yacine.jpg" class="profile-img" alt="Yacine Setifi">
    <div class="info">

        <h2>YACINE SETIFI</h2>
        <div class="arabic">ياسين السطايفي</div>

        <div class="desc">
            Pottery artisan from Setif, Algeria.
            Specialized in handmade pottery, clay vases and ceramic decoration.
        </div>

        <div class="badge">
            Pottery Artisan
        </div>

        <div class="location">
            📍 El Eulma, Setif, Algeria
        </div>

        <div class="contact">
            <a href="tel:+213555111111">📞 Call</a>
            <a href="https://wa.me/213555111111">💬 WhatsApp</a>
        </div>

        <div class="map">
            <iframe src="https://www.google.com/maps?q=El+Eulma+Setif&output=embed"></iframe>
        </div>

    </div>

</div>

<div class="container">

    <div class="card">
        <img src="images/clay.jfif">
        <div class="content">
            <div class="title">Clay Vase</div>
            <div class="price">2500 DA</div>
            <button>Add to Cart</button>
        </div>
    </div>

    <div class="card">
        <img src="images/bowl.jpg">
        <div class="content">
            <div class="title">Ceramic Bowl</div>
            <div class="price">3000 DA</div>
            <button>Add to Cart</button>
        </div>
    </div>

    <div class="card">
        <img src="images/pot.jpg">
        <div class="content">
            <div class="title">Traditional Pot</div>
            <div class="price">2200 DA</div>
            <button>Add to Cart</button>
        </div>
    </div>

    <div class="card">
        <img src="images/decor.jpg">
        <div class="content">
            <div class="title">Decor Plate</div>
            <div class="price">2800 DA</div>
            <button>Add to Cart</button>
        </div>
    </div>

</div>

</body>
</html>
